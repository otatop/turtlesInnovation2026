<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Bird</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #1b2a35; color: #fff; font-family: system-ui, sans-serif;
  }
  canvas { background: #70c5ce; border-radius: 8px; image-rendering: pixelated; max-height: 80vh; max-width: 100vw; touch-action: none; }
  p { opacity: .7; margin: .75rem 0 0; font-size: .9rem; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<p>Click, tap, or press Space to flap</p>

<script>
const canvas = document.getElementById('game');
const screen = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Draw into a small off-screen buffer, then scale it up without smoothing for chunky pixels.
const PIXEL = 5;
const buf = document.createElement('canvas');
buf.width = W / PIXEL;
buf.height = H / PIXEL;
const ctx = buf.getContext('2d');
ctx.imageSmoothingEnabled = false;
screen.imageSmoothingEnabled = false;

const GROUND_H = 80;
const GRAVITY = 0.08;
const FLAP = -3.1;
const PIPE_W = 60;
const PIPE_GAP = 150;
const PIPE_SPEED = 1.25;
const PIPE_INTERVAL = 320; // frames between pipes

let bird, pipes, score, best, state, frame, groundX;
best = Number(localStorage.getItem('flappyBest') || 0);

function reset() {
  bird = { x: 100, y: H / 2 - 40, vy: 0, r: 14 };
  pipes = [];
  score = 0;
  frame = 0;
  state = 'ready'; // ready | playing | over
}

function flap() {
  if (state === 'ready') state = 'playing';
  if (state === 'playing') bird.vy = FLAP;
  else if (state === 'over' && frame > 30) reset();
}

function spawnPipe() {
  const min = 60, max = H - GROUND_H - PIPE_GAP - 60;
  pipes.push({ x: W, top: min + Math.random() * (max - min), scored: false });
}

function die() {
  state = 'over';
  frame = 0;
  if (score > best) {
    best = score;
    try { localStorage.setItem('flappyBest', best); } catch (e) {}
  }
}

function update() {
  frame++;
  groundX = (groundX || 0);

  if (state === 'ready') {
    bird.y = H / 2 - 40 + Math.sin(frame / 10) * 6;
    groundX = (groundX - PIPE_SPEED) % 24;
    return;
  }
  if (state === 'over') {
    // let the bird fall to the ground
    if (bird.y + bird.r < H - GROUND_H) {
      bird.vy += GRAVITY;
      bird.y += bird.vy;
    }
    return;
  }

  bird.vy += GRAVITY;
  bird.y += bird.vy;
  groundX = (groundX - PIPE_SPEED) % 24;

  if (frame % PIPE_INTERVAL === 1) spawnPipe();
  for (const p of pipes) {
    p.x -= PIPE_SPEED;
    if (!p.scored && p.x + PIPE_W < bird.x) { p.scored = true; score++; }
    // circle vs. rectangles
    const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
    if (inX && (bird.y - bird.r < p.top || bird.y + bird.r > p.top + PIPE_GAP)) die();
  }
  pipes = pipes.filter(p => p.x + PIPE_W > 0);

  if (bird.y + bird.r >= H - GROUND_H) { bird.y = H - GROUND_H - bird.r; die(); }
  if (bird.y - bird.r < 0) { bird.y = bird.r; die(); }
}

function drawPipe(p) {
  const bottomY = p.top + PIPE_GAP;
  ctx.fillStyle = '#4caf50';
  ctx.strokeStyle = '#2e7d32';
  ctx.lineWidth = 3;
  // body
  ctx.fillRect(p.x, 0, PIPE_W, p.top);
  ctx.strokeRect(p.x, -3, PIPE_W, p.top + 3);
  ctx.fillRect(p.x, bottomY, PIPE_W, H - GROUND_H - bottomY);
  ctx.strokeRect(p.x, bottomY, PIPE_W, H - GROUND_H - bottomY + 3);
  // caps
  ctx.fillRect(p.x - 4, p.top - 24, PIPE_W + 8, 24);
  ctx.strokeRect(p.x - 4, p.top - 24, PIPE_W + 8, 24);
  ctx.fillRect(p.x - 4, bottomY, PIPE_W + 8, 24);
  ctx.strokeRect(p.x - 4, bottomY, PIPE_W + 8, 24);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(Math.max(-0.5, Math.min(1.2, bird.vy / 10)));
  // body
  ctx.fillStyle = '#ffd93b';
  ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#a67c00'; ctx.lineWidth = 2; ctx.stroke();
  // wing
  const wing = state === 'playing' && bird.vy < 0 ? -4 : 2;
  ctx.fillStyle = '#f5b800';
  ctx.beginPath(); ctx.ellipse(-4, wing + 3, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
  // eye
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6, -5, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(8, -5, 2, 0, Math.PI * 2); ctx.fill();
  // beak
  ctx.fillStyle = '#ff7043';
  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(22, 4); ctx.lineTo(10, 8); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function text(str, x, y, size, align = 'center') {
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.lineWidth = size / 6;
  ctx.strokeStyle = '#000';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = '#fff';
  ctx.fillText(str, x, y);
}

function draw() {
  ctx.setTransform(1 / PIXEL, 0, 0, 1 / PIXEL, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 170 - frame * 0.3) % (W + 120) + W + 120) % (W + 120) - 60;
    const cy = 90 + i * 60;
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI * 2);
    ctx.arc(cx + 20, cy + 5, 16, 0, Math.PI * 2);
    ctx.arc(cx - 20, cy + 6, 14, 0, Math.PI * 2);
    ctx.fill();
  }

  pipes.forEach(drawPipe);

  // ground
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#73bf2e';
  ctx.fillRect(0, H - GROUND_H, W, 14);
  ctx.fillStyle = '#5a9e22';
  for (let x = groundX - 24; x < W + 24; x += 24) {
    ctx.beginPath();
    ctx.moveTo(x, H - GROUND_H); ctx.lineTo(x + 12, H - GROUND_H);
    ctx.lineTo(x + 24, H - GROUND_H + 14); ctx.lineTo(x + 12, H - GROUND_H + 14);
    ctx.fill();
  }

  drawBird();

  if (state === 'ready') {
    text('Flappy Bird', W / 2, 160, 42);
    text('Tap to start', W / 2, 400, 30);
  } else {
    text(String(score), W / 2, 80, 52);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(60, 200, W - 120, 190);
    text('Game Over', W / 2, 250, 36);
    text(`Score: ${score}`, W / 2, 300, 30);
    text(`Best: ${best}`, W / 2, 335, 30);
    if (frame > 30) text('Tap to restart', W / 2, 375, 25);
  }

  screen.clearRect(0, 0, W, H);
  screen.drawImage(buf, 0, 0, W, H);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) flap(); }
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

reset();
loop();
</script>
</body>
</html>
