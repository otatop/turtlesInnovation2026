<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Bird</title>
<style>
  :root { --bg: #1c2b36; --fg: #fff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px;
  }
  canvas {
    height: min(88vh, 720px); aspect-ratio: 400 / 600; max-width: 100%;
    border-radius: 10px; border: 3px solid #0d1820; cursor: pointer; touch-action: none; background: #70c5ce;
  }
  p { margin: 0; opacity: .75; font-size: .9rem; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<p>Space, click, tap or ↑ to flap</p>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GROUND = 80, PIPE_W = 64, GAP = 150, PIPE_SPACING = 210, SPEED = 130;
  const GRAVITY = 1500, FLAP = -430;

  let state = 'ready';            // ready | playing | dead
  let bird, pipes, score, best = 0, groundX = 0, deadTimer = 0, time = 0;
  try { best = +localStorage.getItem('flappyBest') || 0; } catch (e) {}

  const clouds = Array.from({ length: 5 }, () => ({ x: Math.random() * W, y: 40 + Math.random() * 260, s: 0.6 + Math.random() * 0.8 }));

  function reset() {
    bird = { x: 100, y: H / 2 - GROUND / 2, vy: 0, r: 14, rot: 0 };
    pipes = []; score = 0;
    for (let i = 0; i < 3; i++) addPipe(W + 100 + i * PIPE_SPACING);
  }

  function addPipe(x) {
    const min = 70, max = H - GROUND - GAP - 70;
    pipes.push({ x, top: min + Math.random() * (max - min), scored: false });
  }

  function flap() {
    if (state === 'ready') { state = 'playing'; }
    if (state === 'playing') bird.vy = FLAP;
    else if (state === 'dead' && deadTimer > 0.6) { reset(); state = 'ready'; }
  }

  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) flap(); }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

  function die() {
    state = 'dead'; deadTimer = 0;
    if (score > best) {
      best = score;
      try { localStorage.setItem('flappyBest', best); } catch (e) {}
    }
  }

  function update(dt) {
    time += dt;
    clouds.forEach(c => { c.x -= 10 * c.s * dt; if (c.x < -80) c.x = W + 80; });

    if (state === 'ready') {                         // idle bob
      bird.y = H / 2 - GROUND / 2 + Math.sin(time * 5) * 8;
      groundX = (groundX - SPEED * dt) % 24;
      return;
    }
    if (state === 'dead') {
      deadTimer += dt;
      if (bird.y < H - GROUND - bird.r) { bird.vy += GRAVITY * dt; bird.y += bird.vy * dt; bird.rot = Math.min(1.5, bird.rot + 6 * dt); }
      else bird.y = H - GROUND - bird.r;
      return;
    }

    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.45, Math.min(1.3, bird.vy / 500));
    groundX = (groundX - SPEED * dt) % 24;

    for (const p of pipes) {
      p.x -= SPEED * dt;
      if (!p.scored && p.x + PIPE_W < bird.x) { p.scored = true; score++; }
      // circle vs the two pipe rectangles
      if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W &&
          (bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP)) die();
    }
    if (pipes[0].x < -PIPE_W) { pipes.shift(); addPipe(pipes[pipes.length - 1].x + PIPE_SPACING); }

    if (bird.y + bird.r >= H - GROUND) { bird.y = H - GROUND - bird.r; die(); }
    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }
  }

  // ---------- drawing ----------
  function drawCloud(c) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    for (const [dx, dy, r] of [[0, 0, 18], [20, 4, 22], [44, 0, 16]]) { ctx.moveTo(c.x + dx * c.s + r * c.s, c.y + dy); ctx.arc(c.x + dx * c.s, c.y + dy, r * c.s, 0, 6.28); }
    ctx.fill();
  }

  function drawPipe(p) {
    const cap = 26, g = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    g.addColorStop(0, '#5aa51b'); g.addColorStop(0.35, '#a6e048'); g.addColorStop(1, '#3f7c10');
    ctx.fillStyle = g; ctx.strokeStyle = '#2b5a0a'; ctx.lineWidth = 3;
    const rects = [[p.x + 4, 0, PIPE_W - 8, p.top - cap], [p.x, p.top - cap, PIPE_W, cap],
                   [p.x + 4, p.top + GAP + cap, PIPE_W - 8, H - GROUND - p.top - GAP - cap], [p.x, p.top + GAP, PIPE_W, cap]];
    for (const r of rects) { ctx.fillRect(...r); ctx.strokeRect(...r); }
  }

  function drawBird() {
    ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot);
    const flapY = state === 'playing' || state === 'ready' ? Math.sin(time * 22) * 4 : 0;
    ctx.fillStyle = '#f7d51d'; ctx.strokeStyle = '#6b4a00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(7, -5, 6, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(9, -5, 2.4, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#f26b1d'; ctx.beginPath(); ctx.ellipse(14, 4, 8, 4.5, 0, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f0b800'; ctx.beginPath(); ctx.ellipse(-6, 3 + flapY, 9, 6, -0.3, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawGround() {
    ctx.fillStyle = '#ded895'; ctx.fillRect(0, H - GROUND, W, GROUND);
    ctx.fillStyle = '#73bf2e'; ctx.fillRect(0, H - GROUND, W, 14);
    ctx.fillStyle = '#5a9a1f';
    for (let x = groundX - 24; x < W + 24; x += 24) {
      ctx.beginPath(); ctx.moveTo(x, H - GROUND); ctx.lineTo(x + 12, H - GROUND); ctx.lineTo(x + 24, H - GROUND + 14); ctx.lineTo(x + 12, H - GROUND + 14); ctx.fill();
    }
    ctx.fillStyle = '#c9b970'; ctx.fillRect(0, H - GROUND + 14, W, 3);
  }

  function text(str, x, y, size) {
    ctx.font = `bold ${size}px system-ui`; ctx.textAlign = 'center';
    ctx.lineWidth = size / 6; ctx.strokeStyle = '#222'; ctx.lineJoin = 'round';
    ctx.strokeText(str, x, y); ctx.fillStyle = '#fff'; ctx.fillText(str, x, y);
  }

  function render() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#4fb3d9'); sky.addColorStop(1, '#bfeaf2');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    clouds.forEach(drawCloud);
    pipes.forEach(drawPipe);
    drawGround();
    drawBird();

    if (state !== 'ready') text(score, W / 2, 80, 56);
    if (state === 'ready') {
      text('Flappy Bird', W / 2, 150, 44);
      text('Tap or press Space', W / 2, 400, 22);
    } else if (state === 'dead') {
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ded895'; ctx.strokeStyle = '#6b5a22'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(60, 200, W - 120, 170, 12); ctx.fill(); ctx.stroke();
      text('Game Over', W / 2, 170, 40);
      ctx.fillStyle = '#6b5a22'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Score  ' + score, W / 2, 255);
      ctx.fillText('Best   ' + best, W / 2, 295);
      if (deadTimer > 0.6) { ctx.font = '16px system-ui'; ctx.fillText('Tap or press Space to retry', W / 2, 345); }
    }
  }

  reset();
  let last = performance.now();
  (function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt); render();
    requestAnimationFrame(frame);
  })(last);
})();
</script>
</body>
</html>
